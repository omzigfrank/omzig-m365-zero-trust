<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <style>
      .letter { fill: #4A90D9; }
    </style>
  </defs>
  <!-- Ō with notch: outer circle minus inner circle, with a horizontal bar at top -->
  <g class="letter">
    <!-- O outer -->
    <path d="M20 4C9 4 0 13 0 24s9 20 20 20 20-9 20-20S31 4 20 4zm0 30c-5.5 0-10-4.5-10-10S14.5 14 20 14s10 4.5 10 10-4.5 10-10 10z"/>
    <!-- Notch bar at top of O -->
    <rect x="13" y="2" width="14" height="5" rx="1"/>
  </g>
  <!-- M -->
  <text x="46" y="37" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="36" class="letter">M</text>
  <!-- Z -->
  <text x="80" y="37" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="36" fill="#4A90D9" letter-spacing="-1">Z</text>
  <!-- I -->
  <text x="110" y="37" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="36" class="letter">I</text>
  <!-- G -->
  <text x="126" y="37" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="36" class="letter">G</text>
</svg>
